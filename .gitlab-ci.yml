tests:
    image:
        name: pretix/ci-image
    stage: test
    before_script:
        - pip install pip==26.3 uv==0.13.8
        - uv pip install --system wheel==0.48.0 setuptools==84.2.1
    script:
        - uv pip install --system -e ".[dev]"
        - cd src
        - python manage.py check
        - make all compress
        - PRETIX_CONFIG_FILE=tests/ci_sqlite.cfg py.test -n 3 tests --ignore=tests/e2e --maxfail=100
    except:
        - '/^v.*$/'
pypi:
    stage: release
    image:
        name: pretix/ci-image
    before_script:
        - cat $PYPIRC > ~/.pypirc
        - pip install pip==26.3 uv==0.13.8
        - uv pip install --system wheel==0.48.0 setuptools==84.2.1 twine==7.0.0 build==1.6.1 pretix-plugin-build==1.0.2 check-manifest==0.51
    script:
        - uv pip install --system -e ".[dev]"
        - python setup.py sdist
        - uv pip install --system dist/pretix-*.tar.gz
        - python -m pretix migrate
        - python -m pretix check
        - cd src
        - make npminstall
        - cd ..
        - check-manifest
        - python -m build
        - twine check dist/*
        - twine upload dist/*
    only:
        - '/^v.*$/'
    artifacts:
        paths:
            - src/dist/

stages:
    - test
    - build
    - release
